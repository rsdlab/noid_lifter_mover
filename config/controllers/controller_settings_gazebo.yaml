controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mechanum_controller:
      type: mecanum_drive_controller/MecanumDriveController

    rarm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    larm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    waist_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    lifter_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    rhand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    lhand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# この名前は変更しないこと: navigation.yaml が /mechanum_controller/odometry を参照している
mechanum_controller:
  ros__parameters:
    front_left_wheel_command_joint_name: wheel_front_left
    front_right_wheel_command_joint_name: wheel_front_right
    rear_left_wheel_command_joint_name: wheel_rear_left
    rear_right_wheel_command_joint_name: wheel_rear_right

    kinematics:
      base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }
      wheels_radius: 0.075
      sum_of_robot_center_projection_on_X_Y_axis: 0.435759

    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true

    reference_timeout: 0.5
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

rarm_controller:
  ros__parameters:
    joints:
      - r_shoulder_p_joint
      - r_shoulder_r_joint
      - r_shoulder_y_joint
      - r_elbow_joint
      - r_wrist_y_joint
      - r_wrist_p_joint
      - r_wrist_r_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05

